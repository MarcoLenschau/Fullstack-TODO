openapi: '3.0.3'
info:
  title: Fullstack TODO API
  version: '1.0.0'
  description: |
    REST API for managing tasks in the Fullstack TODO application.
servers:
  - url: http://localhost:5000
    description: Local development server
paths:
  /tasks:
    get:
      summary: List tasks
      description: Returns all stored tasks ordered by their identifier.
      tags:
        - Tasks
      responses:
        '200':
          description: List of tasks returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create task
      description: Creates a new task using the supplied payload.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '200':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    delete:
      summary: Delete task
      description: Removes the task with the supplied identifier.
      tags:
        - Tasks
      responses:
        '200':
          description: Task deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultMessage'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Update task
      description: Updates the task with the supplied identifier.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Unique identifier of the task.
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Buy groceries
        description:
          type: string
          nullable: true
          example: Pick up milk and bread from the store
      required:
        - id
        - title
    TaskCreate:
      type: object
      properties:
        title:
          type: string
          example: Finish report
        description:
          type: string
          nullable: true
          example: Compile the quarterly sales figures
      required:
        - title
    TaskUpdate:
      allOf:
        - $ref: '#/components/schemas/TaskCreate'
    DefaultMessage:
      type: object
      properties:
        message:
          type: string
          example: Task 1 updated
        status:
          type: integer
          nullable: true
          example: 404
  responses:
    BadRequest:
      description: Invalid payload supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultMessage'
    NotFound:
      description: Task with the provided identifier was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultMessage'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultMessage'
